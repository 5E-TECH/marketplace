events {}

http {
  server_tokens off;
  client_max_body_size 6m;

  # Docker konteynerlari recreate bo'lganda IP o'zgaradi. Nginx Docker DNS'ni
  # davriy qayta resolve qilmasa eski upstream IP'da qolib, 502 qaytaradi.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api_gateway {
    zone api_gateway 64k;
    server api-gateway:3000 resolve;
  }

  upstream minio_storage {
    zone minio_storage 64k;
    server minio:9000 resolve;
  }

  server {
    listen 80;
    listen [::]:80;

    location / {
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
      proxy_pass http://minio_storage/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
