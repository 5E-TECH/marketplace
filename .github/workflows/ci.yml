name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace_test_pass
          POSTGRES_DB: elchi_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d elchi_marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://marketplace:marketplace_test_pass@localhost:5432/elchi_marketplace_test
    steps:
      - uses: actions/checkout@v4

      - name: Node o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bog'liqliklar (npm ci)
        run: npm ci
        env:
          HUSKY: 0 # CI'da git hook o'rnatish shart emas

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format tekshiruvi (Prettier)
        run: npm run format:check

      - name: Caddy konfiguratsiyasini tekshirish
        run: >-
          docker run --rm
          -e DOMAIN=api.example.com -e APP_DOMAIN=app.example.com
          -e TLS_EMAIL=ops@example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Ops script sintaksisi
        run: |
          node --check scripts/health-monitor.mjs
          node --check scripts/e2e-smoke.mjs
          node --check scripts/export-openapi.mjs
          sh -n scripts/db-backup.sh
          sh -n scripts/db-restore-test.sh

      - name: Build (barcha app)
        run: npm run build:all

      - name: Testlar (Jest)
        run: npm test -- --runInBand

      - name: Inventory coverage
        run: npm run test:inventory:coverage

      # Frontend kontrakt tekshiruvi shu faylga qaraydi. Repodagi nusxa
      # eskirgan bo'lsa CI yiqiladi — kontrakt o'zgarishi e'tibordan qolmaydi.
      - name: OpenAPI kontrakti yangimi
        run: |
          npm run contract:export
          if ! git diff --quiet -- docs/openapi.json; then
            echo "::error::docs/openapi.json eskirgan. Lokalda 'npm run build:all && npm run contract:export' ishlatib, natijani commit qiling."
            git --no-pager diff --stat -- docs/openapi.json
            exit 1
          fi

      - name: OpenAPI'ni artefakt sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-build-test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH konfiguratsiyasini tayyorlash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Production fayllarini serverga yuborish
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'coverage/' \
            --exclude 'backups/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/srv/marketplace/"

      - name: Docker stackni yangilash
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_DOMAIN" <<'REMOTE'
          set -euo pipefail
          deploy_domain=${1:-}
          cd /srv/marketplace
          test -f .env.production

          # Serverdagi qiymatlar ustuvor. Eski server env faylida DOMAIN hali
          # bo'lmasa GitHub production environment'idagi secret ishlatiladi.
          set -a; . ./.env.production; set +a
          export DOMAIN="${DOMAIN:-$deploy_domain}"
          if [ -z "$DOMAIN" ]; then
            echo "XATO: DOMAIN topilmadi — DEPLOY_DOMAIN secret'ini qo'ying yoki .env.production ga DOMAIN kiriting." >&2
            exit 1
          fi
          export TLS_EMAIL="${TLS_EMAIL:-admin@$DOMAIN}"

          # Validator fayldagi qiymatlar bilan birga yuqoridagi deploy
          # override'larini ham tekshiradi.
          sh scripts/validate-production-env.sh .env.production

          # Sotuvchi kabineti domeni berilmagan bo'lsa deploy to'xtamaydi,
          # lekin bu jimgina o'tib ketmasligi kerak.
          if [ -z "${APP_DOMAIN:-}" ]; then
            echo "OGOHLANTIRISH: APP_DOMAIN yo'q — sotuvchi kabineti public domenda ochilmaydi." >&2
            echo "  Kabinetni chiqarish uchun .env.production ga APP_DOMAIN va CORS_ORIGINS qo'shing." >&2
          fi
          # Compose'dagi zaxira qiymat bilan bir xil bo'lishi shart, aks holda
          # quyidagi Caddy tekshiruvi haqiqatda ishlaydigan konfiguratsiyadan
          # boshqasini tekshirgan bo'lardi.
          export APP_DOMAIN="${APP_DOMAIN:-kabinet.localhost}"

          # Caddy ikkala domenning TLS'ini ushlab turadi. Konfiguratsiya xato
          # bo'lsa u ko'tarilmaydi va API ham birga yiqiladi — shuning uchun
          # hech narsaga tegmasdan oldin bir martalik konteynerda tekshiramiz.
          docker run --rm \
            -e DOMAIN -e APP_DOMAIN -e TLS_EMAIL \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            up -d --build --remove-orphans

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            up -d --force-recreate --no-deps caddy

          # Deploy muvaffaqiyatli deyilishidan oldin public API Nginx orqali
          # javob berayotganini tekshiramiz.
          healthy=false
          for attempt in $(seq 1 12); do
            if docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              exec -T api-gateway node -e \
              "fetch('http://127.0.0.1:3000/api/v1/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [ "$healthy" != true ]; then
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              logs --tail=100 api-gateway caddy monitor
            exit 1
          fi

          # Har muvaffaqiyatli deployda backup olinadi va vaqtinchalik PostgreSQL
          # konteynerida tiklab ko'riladi. Buzuq backup saqlanib qolmaydi.
          sh scripts/db-backup.sh
          sh scripts/db-restore-test.sh
          docker image prune -f
          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            ps
          REMOTE

      # DEPLOY_DOMAIN secret'i ixtiyoriy: berilmasa domenni serverdagi
      # .env.production dan o'qiymiz, shunda deploy qo'shimcha sozlamasiz ham
      # to'liq tekshiriladi.
      - name: Public domenni aniqlash
        id: domain
        run: |
          domain="${DEPLOY_DOMAIN:-}"
          if [ -z "$domain" ]; then
            domain=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "sed -n 's/^DOMAIN=//p' /srv/marketplace/.env.production | tail -n 1")
          fi
          if [ -z "$domain" ]; then
            echo "XATO: domen topilmadi — DEPLOY_DOMAIN secret'ini qo'ying yoki .env.production da DOMAIN bo'lsin" >&2
            exit 1
          fi
          echo "domain=$domain" >> "$GITHUB_OUTPUT"

      - name: Public HTTPS smoke
        run: curl --fail --show-error --silent --retry 12 --retry-delay 5 "https://${{ steps.domain.outputs.domain }}/api/v1/health/readiness"
