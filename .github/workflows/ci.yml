name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace_test_pass
          POSTGRES_DB: elchi_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d elchi_marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://marketplace:marketplace_test_pass@localhost:5432/elchi_marketplace_test
    steps:
      - uses: actions/checkout@v4

      - name: Node o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bog'liqliklar (npm ci)
        run: npm ci
        env:
          HUSKY: 0 # CI'da git hook o'rnatish shart emas

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format tekshiruvi (Prettier)
        run: npm run format:check

      - name: Caddy konfiguratsiyasini tekshirish
        run: >-
          docker run --rm
          -e DOMAIN=api.example.com -e APP_DOMAIN=app.example.com
          -e TLS_EMAIL=ops@example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Ops script sintaksisi
        run: |
          node --check scripts/health-monitor.mjs
          node --check scripts/e2e-smoke.mjs
          node --check scripts/export-openapi.mjs
          sh -n scripts/db-backup.sh
          sh -n scripts/db-restore-test.sh

      - name: Build (barcha app)
        run: npm run build:all

      - name: Testlar (Jest)
        run: npm test -- --runInBand

      - name: Inventory coverage
        run: npm run test:inventory:coverage

      # Frontend kontrakt tekshiruvi shu faylga qaraydi. Repodagi nusxa
      # eskirgan bo'lsa CI yiqiladi — kontrakt o'zgarishi e'tibordan qolmaydi.
      - name: OpenAPI kontrakti yangimi
        run: |
          npm run contract:export
          if ! git diff --quiet -- docs/openapi.json; then
            echo "::error::docs/openapi.json eskirgan. Lokalda 'npm run build:all && npm run contract:export' ishlatib, natijani commit qiling."
            git --no-pager diff --stat -- docs/openapi.json
            exit 1
          fi

      - name: OpenAPI'ni artefakt sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-build-test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH konfiguratsiyasini tayyorlash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Production fayllarini serverga yuborish
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'coverage/' \
            --exclude 'backups/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/srv/marketplace/"

      - name: Docker stackni yangilash
        run: |
          # ssh argumentlarni bitta satrga qo'shib yuboradi, shuning uchun
          # `bash -s -- "$DEPLOY_DOMAIN"` da bo'sh qiymat butunlay yo'qoladi va
          # masofadagi skript `set -u` ostida "$1: unbound variable" bilan
          # yiqiladi. Qiymatni pozitsion argument o'rniga muhit o'zgaruvchisi
          # sifatida uzatamiz va oldindan bo'sh emasligini tekshiramiz.
          test -n "${DEPLOY_DOMAIN:-}" || {
            echo "XATO: DEPLOY_DOMAIN secret bo'sh — GitHub production environment'da sozlang" >&2
            exit 1
          }

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            env DEPLOY_DOMAIN="$DEPLOY_DOMAIN" bash -s <<'REMOTE'
          set -euo pipefail
          deploy_domain="${DEPLOY_DOMAIN:?DEPLOY_DOMAIN serverga yetib kelmadi}"
          cd /srv/marketplace
          test -f .env.production

          # Env auditi: placeholder qolmaganini va majburiy kalitlar borligini
          # tekshiradi.
          sh scripts/validate-production-env.sh .env.production

          # Tartib muhim: avval fayl o'qiladi (APP_DOMAIN faqat shu yerda),
          # keyin DOMAIN/TLS_EMAIL deploy secret'idan qayta yoziladi —
          # secret fayldagi qiymatdan ustun turadi.
          set -a; . ./.env.production; set +a
          export DOMAIN="$deploy_domain"
          export TLS_EMAIL="admin@$deploy_domain"

          # Caddy ikkala domenning TLS'ini ushlab turadi. Konfiguratsiya xato
          # bo'lsa u ko'tarilmaydi va API ham birga yiqiladi — shuning uchun
          # hech narsaga tegmasdan oldin bir martalik konteynerda tekshiramiz.
          docker run --rm \
            -e DOMAIN -e APP_DOMAIN -e TLS_EMAIL \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            up -d --build --remove-orphans

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            up -d --force-recreate --no-deps caddy

          # Deploy muvaffaqiyatli deyilishidan oldin public API Nginx orqali
          # javob berayotganini tekshiramiz.
          healthy=false
          for attempt in $(seq 1 12); do
            if docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              exec -T api-gateway node -e \
              "fetch('http://127.0.0.1:3000/api/v1/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [ "$healthy" != true ]; then
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              logs --tail=100 api-gateway caddy monitor
            exit 1
          fi

          # Har muvaffaqiyatli deployda backup olinadi va vaqtinchalik PostgreSQL
          # konteynerida tiklab ko'riladi. Buzuq backup saqlanib qolmaydi.
          sh scripts/db-backup.sh
          sh scripts/db-restore-test.sh
          docker image prune -f
          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            ps
          REMOTE

      - name: Public HTTPS smoke
        run: curl --fail --show-error --silent --retry 12 --retry-delay 5 "https://$DEPLOY_DOMAIN/api/v1/health/readiness"
