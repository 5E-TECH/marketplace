name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace_test_pass
          POSTGRES_DB: elchi_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d elchi_marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://marketplace:marketplace_test_pass@localhost:5432/elchi_marketplace_test
    steps:
      - uses: actions/checkout@v4

      - name: Node o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bog'liqliklar (npm ci)
        run: npm ci
        env:
          HUSKY: 0 # CI'da git hook o'rnatish shart emas

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format tekshiruvi (Prettier)
        run: npm run format:check

      - name: Build (barcha app)
        run: npm run build:all

      - name: Testlar (Jest)
        run: npm test -- --runInBand

      - name: Inventory coverage
        run: npm run test:inventory:coverage
